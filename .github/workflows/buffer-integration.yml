name: Buffer integration smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/buffer_smoke_test.py"
      - ".github/workflows/buffer-integration.yml"
  pull_request:
    paths:
      - ".github/scripts/buffer_smoke_test.py"
      - ".github/workflows/buffer-integration.yml"

permissions:
  contents: read

jobs:
  verify-buffer-linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Buffer authentication and LinkedIn channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python .github/scripts/buffer_smoke_test.py
