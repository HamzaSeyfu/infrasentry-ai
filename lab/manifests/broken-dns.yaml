apiVersion: v1
kind: Pod
metadata:
  name: infrasentry-dns-control
  namespace: infrasentry-lab
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: infrasentry-dns-broken
  namespace: infrasentry-lab
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 192.0.2.53
    options:
      - name: timeout
        value: "1"
      - name: attempts
        value: "1"
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
