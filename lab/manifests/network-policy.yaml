apiVersion: v1
kind: Pod
metadata:
  name: infrasentry-net-debug
  namespace: default
  labels:
    app: infrasentry-net-debug
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-infrasentry-echo-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: infrasentry-echo
  policyTypes:
    - Ingress
  ingress: []
