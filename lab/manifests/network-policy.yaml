apiVersion: v1
kind: Pod
metadata:
  name: infrasentry-client
  labels:
    app: infrasentry-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-infrasentry-demo
spec:
  podSelector:
    matchLabels:
      app: infrasentry-demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed
