apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrasentry-secret-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infrasentry-secret-demo
  template:
    metadata:
      labels:
        app: infrasentry-secret-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo token=$APP_TOKEN; sleep 3600"]
          env:
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infrasentry-demo-secret
                  key: token
